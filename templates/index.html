<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yuanne</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yuanne">
<meta name="theme-color" content="#f5f5f5">
<meta name="description" content="AI 聊天陪伴 App">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    background: #f5f5f5;
    color: #333;
}

/* ===== 聊天页 ===== */
#tab-chat {
    display: none;
    height: calc(100vh - 56px);
}
#tab-chat.active { display: flex; }
.tab-panel.active {
    animation: tab-fade-in 0.25s ease;
}
@keyframes tab-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
#chat-sidebar {
    width: 270px;
    background: #e6e6e6;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #d9d9d9;
    flex-shrink: 0;
}
#chat-sidebar-header {
    padding: 20px 18px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#chat-sidebar-header h2 {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
}
#new-btn {
    width: 30px; height: 30px;
    border: none; border-radius: 6px;
    background: #d4d4d4; color: #555;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
}
#new-btn:hover { background: #c5c5c5; }
#conv-list { flex: 1; overflow-y: auto; }
.conv-item {
    padding: 15px 20px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.1s;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.conv-item:hover { background: #dbdbdb; }
.conv-item.active { background: #d2d2d2; font-weight: 500; }
.conv-item .conv-name { flex: 1; min-width: 0; }
.conv-item .delete-conv {
    visibility: hidden;
    border: none; background: none;
    color: #bbb; cursor: pointer;
    font-size: 16px; padding: 4px; flex-shrink: 0;
}
.conv-item:hover .delete-conv { visibility: visible; }
.conv-item .delete-conv:hover { color: #d44; }
#chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #f5f5f5;
}
#chat-header {
    padding: 16px 24px;
    background: #f5f5f5;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
}
#chat-header h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
#chat-header button {
    border: none; background: none;
    font-size: 17px; cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
    color: #999; transition: background 0.12s;
}
#chat-header button:hover { background: #e5e5e5; }
#chat-box { flex: 1; overflow-y: auto; padding: 20px 24px; }
.msg-row { display: flex; margin-bottom: 20px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar {
    width: 36px; height: 36px; border-radius: 4px;
    flex-shrink: 0; background: #ddd; overflow: hidden;
}
.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-bubble {
    max-width: 70%; padding: 10px 14px;
    line-height: 1.55; font-size: 14px;
    word-break: break-word; white-space: pre-wrap;
    position: relative; margin: 0 10px;
}
.msg-row.user .msg-bubble { background: #d8d8d8; border-radius: 4px; color: #1a1a1a; }
.msg-row.ai .msg-bubble { background: #fff; border-radius: 4px; color: #333; }
.msg-bubble::before {
    content: ""; position: absolute; top: 10px;
    width: 0; height: 0; border: 5px solid transparent;
}
.msg-row.user .msg-bubble::before { right: -8px; border-left-color: #d8d8d8; border-right: 0; }
.msg-row.ai .msg-bubble::before { left: -8px; border-right-color: #fff; border-left: 0; }
#chat-title.typing { color: #999; }
#input-area {
    display: flex; padding: 14px 20px;
    background: #f5f5f5; gap: 10px;
    border-top: 1px solid #e0e0e0; flex-shrink: 0;
}
#user-input {
    flex: 1; padding: 10px 16px;
    border: 1px solid #e0e0e0; border-radius: 6px;
    background: #fff; font-size: 14px; outline: none;
}
#user-input:focus { border-color: #bbb; }
#user-input::placeholder { color: #b0b0b0; }
#send-btn {
    padding: 10px 20px; border: none; border-radius: 6px;
    background: #e0e0e0; color: #aaa;
    font-size: 13px; cursor: pointer; font-weight: 500;
    transition: all 0.12s;
}
#send-btn:not(:disabled) { background: #555; color: #fff; cursor: pointer; }
#send-btn:not(:disabled):hover { background: #444; }
#welcome { text-align: center; color: #bbb; margin-top: 140px; font-size: 13px; }

/* ===== 通讯录 ===== */
#tab-contacts {
    display: none;
    height: calc(100vh - 56px);
    overflow-y: auto;
    background: #f5f5f5;
}
#tab-contacts.active { display: block; }
#contacts-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
    background: #f5f5f5;
    color: #999;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    position: sticky; top: 0; z-index: 5;
    border-bottom: 1px solid #eee;
    max-width: 480px;
}
#contacts-header:hover { background: #eee; }
#contacts-arrow { display: inline-block; width: 16px; text-align: center; transition: transform 0.2s; }
#contacts-list.collapsed { display: none; }
#contacts-list-inner {
    max-width: 480px;
}
.contact-item {
    display: flex; align-items: center;
    padding: 14px 20px;
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background 0.1s;
}
.contact-item:hover { background: #f8f8f8; }
.contact-item.active { background: #eef; }
.contact-avatar {
    width: 44px; height: 44px; border-radius: 6px;
    background: #ddd; flex-shrink: 0;
    overflow: hidden; margin-right: 14px;
}
.contact-avatar img { width: 100%; height: 100%; object-fit: cover; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 15px; font-weight: 500; color: #1a1a1a; }
.contact-bio {
    font-size: 12px; color: #999; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.contact-item .delete-conv {
    visibility: hidden; border: none; background: none;
    color: #bbb; cursor: pointer;
    font-size: 16px; padding: 4px; flex-shrink: 0;
}
.contact-item:hover .delete-conv { visibility: visible; }
.contact-item .delete-conv:hover { color: #d44; }

/* ===== 发现页（朋友圈） ===== */
#tab-discover {
    display: none;
    height: calc(100vh - 56px);
    overflow-y: auto;
    background: #fff;
}
#tab-discover.active { display: block; }
#moments-header {
    padding: 16px 20px;
    font-size: 16px; font-weight: 600;
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    position: sticky; top: 0; z-index: 5;
}
.moment-card {
    background: #fff;
    margin: 8px 0;
    padding: 18px 20px;
    border-bottom: 1px solid #f0f0f0;
}
.moment-top { display: flex; align-items: flex-start; margin-bottom: 12px; }
.moment-avatar {
    width: 40px; height: 40px; border-radius: 4px;
    background: #ddd; flex-shrink: 0;
    overflow: hidden; margin-right: 12px;
}
.moment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.moment-author { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.moment-time { font-size: 11px; color: #bbb; margin-top: 2px; }
.moment-content {
    font-size: 14px; line-height: 1.6;
    color: #333; margin-bottom: 14px; word-break: break-word;
}
.moment-actions {
    display: flex; gap: 24px;
    font-size: 13px; color: #999;
    padding-top: 10px; border-top: 1px solid #f8f8f8;
}
.moment-actions span { cursor: pointer; }
.moment-actions span:hover { color: #555; }
.moment-actions .liked { color: #e44; }
.moment-comments {
    margin-top: 10px; background: #f8f8f8;
    border-radius: 4px; padding: 10px 12px;
}
.moment-comment { font-size: 13px; margin-bottom: 6px; line-height: 1.5; }
.moment-comment:last-child { margin-bottom: 0; }
.moment-comment .cmt-author { font-weight: 500; color: #555; margin-right: 6px; }
.comment-input-row { display: flex; margin-top: 8px; gap: 8px; }
.comment-input-row input {
    flex: 1; padding: 6px 10px;
    border: 1px solid #e0e0e0; border-radius: 4px;
    font-size: 13px; outline: none;
}
.comment-input-row button {
    padding: 6px 14px; border: none; border-radius: 4px;
    background: #555; color: #fff;
    font-size: 12px; cursor: pointer; white-space: nowrap;
}
#moments-empty { text-align: center; color: #bbb; padding: 60px 20px; font-size: 13px; }
#auto-post-status { text-align: center; color: #ccc; font-size: 11px; padding: 8px; }

/* ===== 弹窗 ===== */
.modal-overlay {
    display: none;
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.2);
    justify-content: center; align-items: center;
    z-index: 100;
}
.modal-overlay.show { display: flex; }
.modal {
    background: #fff; border-radius: 8px;
    padding: 28px 26px 20px; width: 400px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
}
.modal h3 { margin-bottom: 20px; font-size: 15px; font-weight: 600; color: #1a1a1a; }
.modal label { font-size: 12px; color: #999; display: block; margin: 12px 0 4px; }
.modal input, .modal textarea {
    width: 100%; padding: 10px 12px;
    border: 1px solid #e0e0e0; border-radius: 6px;
    font-size: 14px; outline: none; font-family: inherit;
    transition: border-color 0.15s;
}
.modal textarea { height: 80px; resize: vertical; }
.modal input:focus, .modal textarea:focus { border-color: #999; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.modal-btns button {
    padding: 8px 22px; border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer; font-weight: 500;
}
.modal-btns .btn-cancel { background: #e8e8e8; color: #333; }
.modal-btns .btn-cancel:hover { background: #ddd; }
.modal-btns .btn-save { background: #555; color: #fff; }
.modal-btns .btn-save:hover { background: #444; }

/* ===== 底部 Tab 栏 ===== */
#tab-bar {
    display: flex;
    background: #f0f0f0;
    border-top: 1px solid #ddd;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 56px; z-index: 50;
}
.tab-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer; color: #999;
    font-size: 11px; transition: color 0.15s;
    user-select: none;
}
.tab-item .tab-icon { margin-bottom: 2px; line-height: 0; pointer-events: none; }
.tab-item.active { color: #333; }


/* ===== ?????? ===== */
.notif-bell {
    position: relative;
    cursor: pointer;
    color: #999;
    display: flex;
    align-items: center;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background 0.12s;
}
.notif-bell:hover { background: #e5e5e5; color: #555; }
.notif-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    background: #e74c3c;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    border-radius: 8px;
    padding: 0 4px;
    display: none;
}
.notif-badge.show { display: block; }

/* ???? - ????? */
.notif-panel {
    position: fixed;
    top: 0;
    right: -360px;
    width: 340px;
    height: 100%;
    background: #fff;
    box-shadow: -4px 0 24px rgba(0,0,0,0.08);
    z-index: 200;
    transition: right 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    display: flex;
    flex-direction: column;
}
.notif-panel.open { right: 0; }
.notif-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px 12px;
    border-bottom: 1px solid #f0f0f0;
    flex-shrink: 0;
}
.notif-panel-header h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
.notif-panel-actions { display: flex; gap: 8px; }
.notif-panel-actions button {
    border: none; background: #f0f0f0;
    font-size: 12px; padding: 5px 12px;
    border-radius: 5px; cursor: pointer;
    color: #666;
}
.notif-panel-actions button:hover { background: #e5e5e5; }
.notif-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.notif-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 20px;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 0.5px solid rgba(0,0,0,0.04);
}
.notif-item:hover { background: #f9f9f9; }
.notif-item.unread { background: #f0f7ff; }
.notif-item.unread:hover { background: #e8f0fe; }
.notif-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e8e8e8;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
}
.notif-icon.msg { background: #e3f0ff; }
.notif-icon.post { background: #e8f8e8; }
.notif-icon.reaction { background: #fff3e0; }
.notif-body { flex: 1; min-width: 0; }
.notif-body .notif-name { font-size: 13px; font-weight: 500; color: #1a1a1a; margin-bottom: 2px; }
.notif-body .notif-text {
    font-size: 12px;
    color: #888;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.notif-body .notif-time {
    font-size: 11px;
    color: #bbb;
    margin-top: 3px;
}
.notif-empty {
    text-align: center;
    color: #bbb;
    padding: 60px 20px;
    font-size: 13px;
}

/* ???? Toast - ????? */
.notif-toast {
    position: fixed;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border-radius: 8px;
    padding: 12px 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    z-index: 300;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 340px;
    transition: top 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
    border: 1px solid #eee;
}
.notif-toast.show { top: 16px; }
.notif-toast .toast-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #e8e8e8; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
}
.notif-toast .toast-body { flex: 1; min-width: 0; }
.notif-toast .toast-name { font-size: 13px; font-weight: 500; color: #1a1a1a; }
.notif-toast .toast-text { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notif-toast .toast-close {
    border: none; background: none; font-size: 16px; color: #ccc;
    cursor: pointer; padding: 2px; flex-shrink: 0;
}
.notif-toast .toast-close:hover { color: #999; }

/* ??? */
.notif-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.15);
    z-index: 190;
    display: none;
}
.notif-overlay.show { display: block; }

/* ===== 移动端响应式 ===== */
@media (max-width: 600px) {
    /* 防止横向溢出 */
    body { overflow-x: hidden; width: 100vw; max-width: 100vw; }
    .app, #tab-chat, #tab-contacts, #tab-discover { max-width: 100vw; }

    /* 聊天页：单列切换布局 */
    #tab-chat {
        position: relative;
        overflow: hidden;
        flex-direction: column;
    }
    #chat-sidebar {
        width: 100% !important;
        max-width: 100vw;
        border-right: none;
        flex-shrink: 0;
        display: flex;
    }
    #chat-sidebar.mobile-hide { display: none !important; }
    #chat-main {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 52px;
        z-index: 10; background: #f5f5f5;
        flex-direction: column;
    }
    #chat-main.mobile-show { display: flex !important; }

    /* 返回按钮 */
    #back-btn {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        border: none; background: none;
        font-size: 20px; cursor: pointer;
        color: #555; padding: 6px 8px; margin-right: 2px;
        border-radius: 6px;
        min-width: 36px; min-height: 36px;
    }
    #back-btn:active { background: #e0e0e0; }
    #chat-header {
        padding: 10px 12px;
        gap: 2px;
        flex-shrink: 0;
    }
    #chat-header h3 {
        font-size: 15px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
    }
    /* 移动端隐藏通知铃铛（节省空间） */
    #chat-header .notif-bell { display: none; }
    #chat-header #settings-btn { font-size: 18px; padding: 4px 10px; }

    /* 对话列表触摸优化 */
    #conv-list { overflow-y: auto; }
    .conv-item {
        padding: 16px 20px;
        min-height: 52px;
        font-size: 15px;
        border-bottom: 1px solid #eee;
    }
    .conv-item .delete-conv { visibility: visible; opacity: 0.5; padding: 8px 10px; font-size: 18px; }

    /* 侧边栏头部 */
    #chat-sidebar-header { padding: 16px 20px 14px; }
    #chat-sidebar-header h2 { font-size: 18px; }
    #new-btn { width: 36px; height: 36px; font-size: 22px; border-radius: 8px; }

    /* 消息区域 */
    .msg-bubble { max-width: 82%; font-size: 15px; }
    #chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px;
        -webkit-overflow-scrolling: touch;
    }
    .msg-row { margin-bottom: 16px; }

    /* 输入区域固定在底部 */
    #input-area {
        padding: 8px 10px;
        gap: 8px;
        flex-shrink: 0;
        background: #f0f0f0;
        border-top: 1px solid #ddd;
    }
    #user-input {
        font-size: 16px;
        padding: 10px 14px;
        border-radius: 20px;
    }
    #send-btn {
        padding: 10px 16px;
        font-size: 14px;
        border-radius: 20px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    /* 弹窗 */
    .modal { width: 90vw; max-width: 400px; padding: 22px 18px 16px; }
    .modal h3 { font-size: 15px; margin-bottom: 16px; }
    .modal input, .modal textarea { font-size: 16px; }

    /* 通知面板全宽 */
    .notif-panel { width: 100vw; right: -100vw; }
    .notif-panel.open { right: 0; }
    .notif-panel-header { padding: 16px 16px 12px; }
    .notif-item { min-height: 56px; padding: 14px 16px; }
    .notif-toast { max-width: 90vw; left: 5vw; transform: none; }

    /* 通讯录 & 发现页 */
    #contacts-header, #contacts-list-inner { max-width: 100%; }
    .contact-item .delete-conv { visibility: visible; opacity: 0.5; padding: 8px 10px; font-size: 18px; }
    .comment-input-row input { font-size: 16px; }
    .comment-input-row button { padding: 8px 16px; font-size: 13px; }
    .moment-card { padding: 14px 16px; }

    /* 底部 Tab 栏 */
    #tab-bar { height: 52px; }
    #tab-chat, #tab-contacts, #tab-discover { height: calc(100vh - 52px); }
    .tab-item { font-size: 10px; }
    .tab-item .tab-icon svg { width: 20px; height: 20px; }
}

/* ===== 通话界面 ===== */
#call-btn {
    display: none;
    border: none; background: none;
    font-size: 18px; cursor: pointer;
    padding: 4px 8px; border-radius: 6px;
    color: #999; transition: background 0.12s;
}
#call-btn:hover, #call-btn:active { background: #e5e5e5; }
#call-screen {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #1a1a2e;
    z-index: 500;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #e8e0d8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
#call-screen.active { display: flex; }
#call-avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    overflow: hidden;
    margin-bottom: 20px;

<script>


let conversations = [];
let currentConvId = null;
let modalMode = "new";
let staggerTimer = null;
let activeGen = 0;  // 【修复】世代计数器：切对话时+1，异步操作校验用，解决 await 窗口期 currentConvId 未更新问题

const AVATAR_URL = "/static/avatar.jpg";

const Api = {
    async get(url) { return (await fetch(url)).json(); },
    async post(url, body) { return (await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) })).json(); },
    async put(url, body) { return (await fetch(url, { method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) })).json(); },
    async del(url) { await fetch(url, { method:"DELETE" }); }
};

async function loadConversations() {
    conversations = await Api.get("/api/conversations");
    renderConvList();
}

function renderConvList() {
    const list = document.getElementById("conv-list");
    if (!list) return;
    list.innerHTML = conversations.map(c => `
        <div class="conv-item${c.id === currentConvId ? ' active' : ''}" data-id="${c.id}">
            <span class="conv-name">${escapeHtml(c.name)}</span>
            <button class="delete-conv" data-id="${c.id}">×</button>
        </div>
    `).join("");
    list.querySelectorAll(".conv-item").forEach(el => {
        el.addEventListener("click", e => {
            if (e.target.classList.contains("delete-conv")) return;
            switchConversation(el.dataset.id);
        });
    });
    list.querySelectorAll(".delete-conv").forEach(btn => {
        btn.addEventListener("click", async e => {
            e.stopPropagation();
            await Api.del(`/api/conversations/${btn.dataset.id}`);
            if (currentConvId === btn.dataset.id) { currentConvId = null; renderChatArea(); }
            await loadConversations();
        });
    });
}

function renderContacts() {
    const list = document.getElementById("contacts-list-inner");
    if (!list) return;
    list.innerHTML = conversations.map(c => {
        const bio = (c.persona || "").replace(/[\n\r]/g, " ").substring(0, 30) + "...";
        return '<div class="contact-item' + (c.id === currentConvId ? ' active' : '') + '" data-id="' + c.id + '">'
            + '<div class="contact-avatar"><img src="/static/ima.jpg" alt=""></div>'
            + '<div class="contact-info"><div class="contact-name">' + escapeHtml(c.name) + '</div>'
            + '<div class="contact-bio">' + escapeHtml(bio) + '</div></div>'
            + '<button class="delete-conv" data-id="' + c.id + '">×</button>'
            + '</div>';
    }).join("");
    list.querySelectorAll(".contact-item").forEach(el => {
        el.addEventListener("click", e => {
            if (e.target.classList.contains("delete-conv")) return;
            switchConversation(el.dataset.id);
        });
    });
    list.querySelectorAll(".delete-conv").forEach(btn => {
        btn.addEventListener("click", async e => {
            e.stopPropagation();
            await Api.del(`/api/conversations/${btn.dataset.id}`);
            if (currentConvId === btn.dataset.id) { currentConvId = null; renderChatArea(); }
            await loadConversations();
        });
    });
}

async function switchConversation(id) {
    // 【修复】先递增世代，让所有进行中的异步操作（SSE/autoMessage/showLines）立即失效
    activeGen++;
    // 【修复】currentConvId 提前到 await 之前更新，旧锁立即生效
    currentConvId = id;
    clearAutoTimer();
    if (staggerTimer) { clearInterval(staggerTimer); staggerTimer = null; }
    // 立刻清空聊天区，避免旧内容残留
    const box = document.getElementById("chat-box");
    if (box) { box.innerHTML = '<div id="welcome">加载中...</div>'; }
    document.getElementById("chat-title").textContent = "加载中...";
    document.getElementById("settings-btn").style.display = "none";
    document.getElementById("user-input").disabled = true;
    try {
        await loadConversations();
    } catch(e) {
        // 加载失败也继续渲染（用内存中的数据）
    }
    // 加载期间可能又切走了，再次校验
    if (currentConvId !== id) return;
    const conv = conversations.find(c => c.id === id);
    document.getElementById("chat-title").textContent = conv ? conv.name : "";
    document.getElementById("settings-btn").style.display = "inline-block";
    document.getElementById("user-input").disabled = false;
    document.getElementById("send-btn").disabled = true;
    renderConvList();
    renderChatArea();
    if (conv && (!conv.messages || conv.messages.length === 0)) {
        sendMessage();
    }
    // 移动端：自动切换到聊天视图
    if (isMobile()) showMobileChatView();
}

function renderChatArea() {
    const conv = conversations.find(c => c.id === currentConvId);
    const box = document.getElementById("chat-box");
    if (!box) return;
    if (!conv || !conv.messages || conv.messages.length === 0) {
        box.innerHTML = '<div id="welcome">开始聊天吧 ✨</div>';
        console.log("[渲染] chatArea: 无消息");
        return;
    }
    console.log("[渲染] chatArea: conv=", conv.name, "msgCount=", conv.messages.length, "lastMsg=", (conv.messages[conv.messages.length-1]?.content||"").substring(0,30));
    box.innerHTML = conv.messages.map(m => {
        const isUser = m.role === "user";
        if (isUser) {
            return `<div class="msg-row user">
                <div class="msg-avatar"><img src="${AVATAR_URL}" alt=""></div>
                <div class="msg-bubble">${escapeHtml(m.content)}</div>
            </div>`;
        }
        const lines = m.content.split(/\n/).filter(l => l.trim());
        return lines.map(line =>
            `<div class="msg-row ai">
                <div class="msg-avatar"><img src="/static/ima.jpg" alt=""></div>
                <div class="msg-bubble">${escapeHtml(line)}</div>
            </div>`
        ).join("");
    }).join("");
    box.scrollTop = box.scrollHeight;
}

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
}

async function sendMessage() {
    if (!currentConvId) return;
    // 【修复】捕获当前世代，异步SSE流返回后校验世代未变，防止切对话时消息串位
    const originConvId = currentConvId;
    const myGen = activeGen;
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.disabled = true;
    document.getElementById("send-btn").disabled = true;
    clearAutoTimer();
    showTyping(true);
    const box = document.getElementById("chat-box");
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();
    const conv = conversations.find(c => c.id === originConvId);
    box.insertAdjacentHTML("beforeend",
        '<div class="msg-row user">'
        + '<div class="msg-avatar"><img src="' + AVATAR_URL + '" alt=""></div>'
        + '<div class="msg-bubble">' + escapeHtml(text) + '</div>'
        + '</div>');
    box.scrollTop = box.scrollHeight;
    let aiText = "";
    let streamHandled = false;  // 【修复】标记 SSE 流是否已被处理（done/error），防止安全网误触发
    try {
        const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conv_id: originConvId, message: text })
        });
        // 【修复】世代校验：切过对话则中止
        if (activeGen !== myGen) { showTyping(false); return; }
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            // 每次读取后校验世代
            if (activeGen !== myGen) { showTyping(false); return; }
            const chunk = decoder.decode(value);
            const sseLines = chunk.split("\n");
            for (const sseLine of sseLines) {
                if (!sseLine.startsWith("data: ")) continue;
                const dataStr = sseLine.slice(6);
                if (dataStr === "[DONE]") continue;
                try {
                    const data = JSON.parse(dataStr);
                    if (data.done) {
                        streamHandled = true;
                        if (conv) {
                            conv.messages = conv.messages || [];
                            conv.messages.push({ role: "user", content: text });
                            conv.messages.push({ role: "assistant", content: data.full });
                        }
                        const lines = data.full.split(/\n/).filter(l => l.trim());
                        if (lines.length === 0) { showTyping(false); enableInput(); }
                        else { showLines(lines, 0); }
                        resetAutoTimer();
                    } else if (data.error) {
                        streamHandled = true;
                        console.error("[SSE错误]", data.error);
                        showTyping(false); enableInput();
                    } else if (data.content) { aiText += data.content; }
                } catch (e) {}
            }
        }
        // 【修复】流意外结束安全网：没收到 done/error 事件才兜底
        if (!streamHandled) { showTyping(false); enableInput(); }
    } catch (err) { showTyping(false); enableInput(); }
    function showLines(lines, idx) {
        // 【修复】世代校验：切过对话则停止逐行渲染
        if (activeGen !== myGen) { return; }
        if (idx >= lines.length) { showTyping(false); enableInput(); return; }
        const row = document.createElement("div");
        row.className = "msg-row ai";
        row.innerHTML = '<div class="msg-avatar"><img src="/static/ima.jpg" alt=""></div><div class="msg-bubble">' + escapeHtml(lines[idx]) + '</div>';
        box.appendChild(row); box.scrollTop = box.scrollHeight;
        setTimeout(function() { showLines(lines, idx + 1); }, 2000);
    }
    function enableInput() { input.disabled = false; updateSendBtn(); input.focus(); }
}

function updateSendBtn() {
    const btn = document.getElementById("send-btn");
    if (!btn) return;
    const hasText = document.getElementById("user-input").value.trim();
    btn.disabled = !hasText;
}

function showTyping(show) {
    const title = document.getElementById("chat-title");
    if (!title) return;
    if (show) {
        if (!title.classList.contains("typing")) title._original = title.textContent;
        title.textContent = "正在输入中...";
        title.classList.add("typing");
    } else {
        // 【修复】仅当 _original 看起来是正常名字时才还原，防止"加载中..."被覆盖
        if (title._original && title._original !== "加载中...") title.textContent = title._original;
        title.classList.remove("typing");
        title._original = null;
    }
}

let autoTimer = null, autoCount = 0;
const AUTO_DELAY = 60, AUTO_MAX = 3;
function clearAutoTimer() { clearTimeout(autoTimer); autoTimer = null; }
function resetAutoTimer() {
    clearAutoTimer(); autoCount = 0;
    if (!currentConvId) return;
    autoTimer = setTimeout(sendAutoMessage, AUTO_DELAY * 1000);
}
async function sendAutoMessage() {
    if (!currentConvId || autoCount >= AUTO_MAX) return;
    // 【修复】捕获当前世代，异步返回后校验世代未变，防止切对话时消息串位
    const originConvId = currentConvId;
    const myGen = activeGen;
    showTyping(true);
    try {
        const res = await fetch("/api/auto-message", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conv_id: originConvId })
        });
        // 【修复】世代校验：切过对话则放弃渲染
        if (activeGen !== myGen) { showTyping(false); return; }
        const data = await res.json();
        if (data.content) {
            const conv = conversations.find(c => c.id === originConvId);
            if (conv) {
                conv.messages = conv.messages || [];
                conv.messages.push({ role: "assistant", content: data.content });
            }
            // 再次校验世代
            if (activeGen !== myGen) { showTyping(false); return; }
            const box = document.getElementById("chat-box");
            const lines = data.content.split(/\n/).filter(l => l.trim());
            for (const line of lines) {
                box.insertAdjacentHTML("beforeend",
                    '<div class="msg-row ai"><div class="msg-avatar"><img src="/static/ima.jpg" alt=""></div><div class="msg-bubble">' + escapeHtml(line) + '</div></div>');
            }
            box.scrollTop = box.scrollHeight; autoCount++; showTyping(false);
            if (autoCount < AUTO_MAX) autoTimer = setTimeout(sendAutoMessage, AUTO_DELAY * 1000);
        }
    } catch (e) { showTyping(false); }
}

function openModal(mode) {
    modalMode = mode;
    const conv = mode === "edit" ? conversations.find(c => c.id === currentConvId) : null;
    document.getElementById("modal-title").textContent = mode === "new" ? "新建对话" : "编辑人设";
    document.getElementById("modal-name").value = conv ? conv.name : "";
    document.getElementById("modal-persona").value = conv ? (conv.persona || "") : "";
    // 填充语音选择
    const voiceSelect = document.getElementById("modal-voice");
    voiceSelect.innerHTML = '<option value="">默认声音</option>';
    loadVoices().then(voices => {
        voices.forEach(v => {
            const sel = (conv && conv.voice === v.name) ? ' selected' : '';
            voiceSelect.innerHTML += '<option value="' + v.name + '"' + sel + '>' + v.name + ' (' + v.lang + ')</option>';
        });
    });
    document.getElementById("modal").classList.add("show");
}
function closeModal() { document.getElementById("modal").classList.remove("show"); }

document.getElementById("modal-save").addEventListener("click", async () => {
    const name = document.getElementById("modal-name").value.trim() || "未命名";
    const persona = document.getElementById("modal-persona").value.trim();
    const voice = document.getElementById("modal-voice").value;
    if (modalMode === "new") {
        const conv = await Api.post("/api/conversations", { name, persona, voice });
        await loadConversations();
        switchConversation(conv.id);
    } else if (modalMode === "edit" && currentConvId) {
        await Api.put(`/api/conversations/${currentConvId}`, { name, persona, voice });
        await loadConversations();
        renderChatArea(); renderConvList();
    }
    closeModal();
});

document.getElementById("new-btn").addEventListener("click", () => openModal("new"));
document.getElementById("settings-btn").addEventListener("click", () => openModal("edit"));
document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("user-input").addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
document.getElementById("user-input").addEventListener("input", function(e) { updateSendBtn(); resetAutoTimer(); });

// 初始化：加载对话
loadConversations();

// ========== 移动端导航 ==========
function isMobile() { return window.innerWidth <= 600; }
function showMobileChatView() {
    if (!isMobile()) return;
    document.getElementById("chat-sidebar").classList.add("mobile-hide");
    document.getElementById("chat-main").classList.add("mobile-show");
}
function goBackToConvList() {
    if (!isMobile()) return;
    document.getElementById("chat-sidebar").classList.remove("mobile-hide");
    document.getElementById("chat-main").classList.remove("mobile-show");
}
function resetMobileLayout() {
    document.getElementById("chat-sidebar").classList.remove("mobile-hide");
    document.getElementById("chat-main").classList.remove("mobile-show");
}
// 监听窗口大小变化

// ========== Tab 切换 ==========
let currentTab = "chat";
document.querySelectorAll("#tab-bar .tab-item").forEach(item => {
    item.addEventListener("click", function() { switchTab(this.dataset.tab); });
});

function switchTab(tab) {
    try {
        currentTab = tab;
        document.querySelectorAll("#tab-bar .tab-item").forEach(t => t.classList.remove("active"));
        var tabBtn = document.querySelector("#tab-bar .tab-item[data-tab='" + tab + "']");
        if (tabBtn) tabBtn.classList.add("active");

        document.getElementById("tab-chat").classList.remove("active");
        document.getElementById("tab-contacts").classList.remove("active");
        document.getElementById("tab-discover").classList.remove("active");

        if (tab === "chat") {
            document.getElementById("tab-chat").classList.add("active");
            stopAutoPostTimer();
        } else if (tab === "contacts") {
            document.getElementById("tab-contacts").classList.add("active");
            renderContacts();
            stopAutoPostTimer();
        } else if (tab === "discover") {
            document.getElementById("tab-discover").classList.add("active");
            loadPosts();
            startAutoPostTimer();
        }
    } catch(e) { console.error("switchTab error:", e); }
}

function toggleContacts() {
    const list = document.getElementById("contacts-list");
    const arrow = document.getElementById("contacts-arrow");
    list.classList.toggle("collapsed");
    arrow.style.transform = list.classList.contains("collapsed") ? "rotate(180deg)" : "";
}

// ========== 朋友圈 ==========
let posts = [], autoPostTimer = null;
const AUTO_POST_MIN = 3 * 60 * 1000, AUTO_POST_MAX = 8 * 60 * 1000;

async function loadPosts() {
    try { const res = await fetch("/api/posts"); posts = await res.json(); renderFeed(); } catch(e) {}
}

function renderFeed() {
    const feed = document.getElementById("moments-feed");
    if (!feed) return;
    if (posts.length === 0) {
        feed.innerHTML = '<div id="moments-empty">还没有动态<br><small>TA会不定时更新动态</small></div>';
        return;
    }
    feed.innerHTML = posts.map(p => {
        const timeStr = new Date(p.timestamp * 1000).toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
        const isLiked = p.likes.indexOf(currentConvId) >= 0;
        const commentsHTML = p.comments.map(cmt =>
            '<div class="moment-comment"><span class="cmt-author">' + escapeHtml(cmt.author_name) + '</span>' + escapeHtml(cmt.content) + '</div>'
        ).join("");
        const showComments = p._showComments ? ' style="display:block"' : ' style="display:none"';
        return '<div class="moment-card" data-post-id="' + p.id + '">'
            + '<div class="moment-top">'
            + '<div class="moment-avatar"><img src="/static/ima.jpg" alt=""></div>'
            + '<div><div class="moment-author">' + escapeHtml(p.author_name) + '</div>'
            + '<div class="moment-time">' + timeStr + '</div></div></div>'
            + '<div class="moment-content">' + escapeHtml(p.content) + '</div>'
            + '<div class="moment-actions">'
            + '<span class="' + (isLiked ? 'liked' : '') + '" data-action="like">❤️ ' + p.likes.length + '</span>'
            + '<span data-action="comment">💬 ' + p.comments.length + '</span></div>'
            + '<div class="moment-comments"' + showComments + '>'
            + commentsHTML
            + '<div class="comment-input-row">'
            + '<input type="text" placeholder="评论..." data-post-id="' + p.id + '">'
            + '<button data-post-id="' + p.id + '">发送</button></div></div></div>';
    }).join("");

    feed.querySelectorAll('[data-action="like"]').forEach(el => {
        el.addEventListener("click", async function() {
            const card = this.closest(".moment-card"); const postId = card.dataset.postId;
            if (!currentConvId) { switchTab("chat"); return; }
            const res = await fetch("/api/posts/" + postId + "/like", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ conv_id: currentConvId })
            });
            const data = await res.json();
            this.classList.toggle("liked", data.likes.indexOf(currentConvId) >= 0);
            this.textContent = "❤️ " + data.count;
        });
    });
    feed.querySelectorAll('[data-action="comment"]').forEach(el => {
        el.addEventListener("click", function() {
            const card = this.closest(".moment-card"); const postId = card.dataset.postId;
            const post = posts.find(p => p.id === postId);
            if (post) { post._showComments = !post._showComments; renderFeed(); }
        });
    });
    feed.querySelectorAll(".comment-input-row button").forEach(btn => {
        btn.addEventListener("click", async function() {
            const postId = this.dataset.postId;
            const input = this.parentElement.querySelector("input");
            const content = input.value.trim();
            if (!content || !currentConvId) return;
            const res = await fetch("/api/posts/" + postId + "/comment", {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ conv_id: currentConvId, content: content })
            });
            if (res.ok) { input.value = ""; await loadPosts();
                const post = posts.find(p => p.id === postId);
                if (post) post._showComments = true; renderFeed(); }
        });
    });
}

function startAutoPostTimer() { if (autoPostTimer) return; scheduleAutoPost(); }
function scheduleAutoPost() {
    const delay = AUTO_POST_MIN + Math.random() * (AUTO_POST_MAX - AUTO_POST_MIN);
    autoPostTimer = setTimeout(async () => {
        try {
            document.getElementById("auto-post-status").textContent = "AI 正在发动态...";
            const res = await fetch("/api/auto-post", { method: "POST" });
            if (res.ok) { await loadPosts(); document.getElementById("auto-post-status").textContent = ""; }
        } catch(e) {}
        if (currentTab === "discover") scheduleAutoPost();
    }, delay);
}
function stopAutoPostTimer() { clearTimeout(autoPostTimer); autoPostTimer = null; }

loadPosts();

let notifications = [];
let notifToastTimer = null;

async function loadNotifications() {
    try {
        const res = await fetch('/api/notifications');
        notifications = await res.json();
        renderNotifications();
    } catch(e) {}
}

function renderNotifications() {
    const list = document.getElementById('notif-list');
    if (!list) return;
    const unread = notifications.filter(n => !n.read).length;
    updateBadge(unread);

    if (notifications.length === 0) {
        list.innerHTML = '<div class="notif-empty">🔔 暂无通知</div>';
        return;
    }
    list.innerHTML = notifications.map(n => {
        const iconMap = { 'new_message': '💬', 'auto_message': '💬', 'new_post': '📝', 'post_reaction': '❤️' };
        const iconClass = { 'new_message': 'msg', 'auto_message': 'msg', 'new_post': 'post', 'post_reaction': 'reaction' };
        const icon = iconMap[n.type] || '💬';
        const cls = iconClass[n.type] || '';
        const timeStr = new Date(n.timestamp * 1000).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const unreadCls = n.read ? '' : ' unread';
        return '<div class="notif-item' + unreadCls + '" data-id="' + n.id + '" data-conv-id="' + n.conv_id + '">'
            + '<div class="notif-icon ' + cls + '">' + icon + '</div>'
            + '<div class="notif-body">'
            + '<div class="notif-name">' + escapeHtml(n.conv_name) + '</div>'
            + '<div class="notif-text">' + escapeHtml(n.content) + '</div>'
            + '<div class="notif-time">' + timeStr + '</div>'
            + '</div></div>';
    }).join('');

    list.querySelectorAll('.notif-item').forEach(el => {
        el.addEventListener('click', async function() {
            const convId = this.dataset.convId;
            const id = this.dataset.id;
            // Mark as read
            await fetch('/api/notifications/read', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: [id] })
            });
            closeNotifPanel();
            // Switch to conversation
            if (convId && convId !== currentConvId) {
                await switchConversation(convId);
            } else if (currentTab !== 'chat') {
                switchTab('chat');
            }
        });
    });
}

function updateBadge(count) {
    const badge = document.getElementById('notif-badge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.classList.add('show');
    } else {
        badge.classList.remove('show');
    }
}

function openNotifPanel() {
    document.getElementById('notif-panel').classList.add('open');
    document.getElementById('notif-overlay').classList.add('show');
    loadNotifications(); // refresh on open
}

function closeNotifPanel() {
    document.getElementById('notif-panel').classList.remove('open');
    document.getElementById('notif-overlay').classList.remove('show');
}

function showNotifToast(notif) {
    const toast = document.getElementById('notif-toast');
    if (!toast) return;
    const iconMap = { 'new_message': '💬', 'auto_message': '💬', 'new_post': '📝', 'post_reaction': '❤️' };
    document.getElementById('toast-avatar').textContent = iconMap[notif.type] || '💬';
    document.getElementById('toast-name').textContent = notif.conv_name;
    document.getElementById('toast-text').textContent = notif.content;
    toast.classList.add('show');
    toast.dataset.convId = notif.conv_id;
    clearTimeout(notifToastTimer);
    notifToastTimer = setTimeout(() => { toast.classList.remove('show'); }, 4000);
}

function hideNotifToast() {
    const toast = document.getElementById('notif-toast');
    toast.classList.remove('show');
    clearTimeout(notifToastTimer);
}

// ========== SSE ?????? ==========
function connectNotifySSE() {
    let es = null;
    function connect() {
        if (es) es.close();
        try {
            es = new EventSource('/api/notify/stream');
            es.onmessage = function(e) {
                try {
                    const notif = JSON.parse(e.data);
                    // Add to front of local list
                    notifications.unshift(notif);
                    if (notifications.length > 50) notifications = notifications.slice(0, 50);
                    renderNotifications();
                    // Show toast if panel is closed and not on chat tab
                    const panel = document.getElementById('notif-panel');
                    if (!panel.classList.contains('open')) {
                        showNotifToast(notif);
                    }
                } catch(err) {}
            };
            es.onerror = function() {
                es.close();
                setTimeout(connect, 3000);
            };
        } catch(e) {
            setTimeout(connect, 5000);
        }
    }
    connect();
}

// ========== Event Bindings ==========
document.addEventListener('DOMContentLoaded', function() {
    // Bell click
    const bell = document.getElementById('notif-bell');
    if (bell) {
        bell.addEventListener('click', function(e) {
            e.stopPropagation();
            openNotifPanel();
        });
    }

    // Overlay click to close
    const overlay = document.getElementById('notif-overlay');
    if (overlay) {
        overlay.addEventListener('click', closeNotifPanel);
    }

    // Toast click to jump
    const toast = document.getElementById('notif-toast');
    if (toast) {
        toast.addEventListener('click', function(e) {
            if (e.target.classList.contains('toast-close')) return;
            const convId = this.dataset.convId;
            hideNotifToast();
            if (convId) {
                if (convId !== currentConvId) {
                    switchConversation(convId);
                }
                if (currentTab !== 'chat') {
                    switchTab('chat');
                }
            }
        });
    }

    // Toast close button
    const toastClose = document.getElementById('toast-close');
    if (toastClose) {
        toastClose.addEventListener('click', function(e) {
            e.stopPropagation();
            hideNotifToast();
        });
    }

    // Mark all read
    const readAllBtn = document.getElementById('notif-read-all');
    if (readAllBtn) {
        readAllBtn.addEventListener('click', async function() {
            await fetch('/api/notifications/read-all', { method: 'POST' });
            await loadNotifications();
            renderNotifications();
        });
    }

    // Clear all
    const clearBtn = document.getElementById('notif-clear');
    if (clearBtn) {
        clearBtn.addEventListener('click', async function() {
            await fetch('/api/notifications/clear', { method: 'POST' });
            await loadNotifications();
            renderNotifications();
        });
    }
});

// ========== 语音功能 ==========
function loadVoices() {
    return new Promise(resolve => {
        const voices = speechSynthesis.getVoices();
        if (voices.length > 0) { resolve(voices.filter(function(v) { return v.lang.startsWith('zh'); })); }
        else { speechSynthesis.onvoiceschanged = function() { resolve(speechSynthesis.getVoices().filter(function(v) { return v.lang.startsWith('zh'); })); }; }
    });
}
function speakText(text, voiceName) {
    if (!text) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 1.0; u.pitch = 1.0; u.volume = 1.0;
    if (voiceName) {
        var match = speechSynthesis.getVoices().find(function(v) { return v.name === voiceName; });
        if (match) u.voice = match;
    }
    speechSynthesis.speak(u);
}
function autoSpeakAiReply(conv, text) {
    if (!isInCall) return;
    speakText(text, (conv && conv.voice) ? conv.voice : '');
}

// ========== 麦克风按钮 ==========
var micRecognition = null;
document.getElementById('mic-btn').addEventListener('pointerdown', function(e) {
    e.preventDefault();
    var btn = this;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('浏览器不支持语音识别，请用 Chrome'); return; }
    if (micRecognition) { micRecognition.abort(); }
    micRecognition = new SR();
    micRecognition.lang = 'zh-CN';
    micRecognition.interimResults = false;
    micRecognition.maxAlternatives = 1;
    btn.classList.add('listening');
    micRecognition.onresult = function(e) {
        var t = e.results[0][0].transcript;
        var inp = document.getElementById('user-input');
        inp.value = (inp.value + ' ' + t).trim();
        updateSendBtn();
    };
    micRecognition.onerror = function() { btn.classList.remove('listening'); };
    micRecognition.onend = function() { btn.classList.remove('listening'); micRecognition = null; };
    micRecognition.start();
});

// ========== 通话界面 ==========
var isInCall = false, callConvId = null, callPollInterval = null;

document.getElementById('call-btn').addEventListener('click', function() {
    if (!currentConvId) return;
    openCallScreen();
});

function openCallScreen() {
    isInCall = true; callConvId = currentConvId;
    var conv = conversations.find(function(c) { return c.id === currentConvId; });
    document.getElementById('call-avatar').querySelector('img').src = '/static/ima.jpg';
    document.getElementById('call-name').textContent = conv ? conv.name : 'AI';
    document.getElementById('call-status').textContent = '通话中...';
    document.getElementById('call-subtitles').innerHTML = '';
    document.getElementById('call-screen').classList.add('active');
    startCallPollForAiReply();
}

function closeCallScreen() {
    isInCall = false; callConvId = null;
    speechSynthesis.cancel();
    if (callPollInterval) { clearInterval(callPollInterval); callPollInterval = null; }
    document.getElementById('call-screen').classList.remove('active');
}

document.getElementById('call-hangup').addEventListener('click', closeCallScreen);

var callRecognition = null;
document.getElementById('call-hold-btn').addEventListener('pointerdown', function(e) {
    e.preventDefault();
    var btn = this;
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    if (callRecognition) { callRecognition.abort(); }
    callRecognition = new SR();
    callRecognition.lang = 'zh-CN';
    callRecognition.interimResults = false;
    callRecognition.maxAlternatives = 1;
    btn.classList.add('listening');
    document.getElementById('call-status').textContent = '正在听...';
    callRecognition.onresult = function(e) {
        var text = e.results[0][0].transcript;
        addCallSubtitle('user', text);
        sendMessageFromCall(text);
    };
    callRecognition.onerror = function() {
        btn.classList.remove('listening');
        document.getElementById('call-status').textContent = '通话中...';
    };
    callRecognition.onend = function() {
        btn.classList.remove('listening');
        document.getElementById('call-status').textContent = '通话中...';
        callRecognition = null;
    };
    callRecognition.start();
});

function addCallSubtitle(role, text) {
    var subs = document.getElementById('call-subtitles');
    var div = document.createElement('div');
    div.className = 'call-sub ' + role;
    div.textContent = text;
    subs.appendChild(div);
    subs.scrollTop = subs.scrollHeight;
}

async function sendMessageFromCall(text) {
    if (!callConvId || !text) return;
    if (currentConvId !== callConvId) { await switchConversation(callConvId); }
    var inp = document.getElementById('user-input');
    inp.value = text;
    updateSendBtn();
    await sendMessage();
}

function startCallPollForAiReply() {
    if (callPollInterval) clearInterval(callPollInterval);
    callPollInterval = setInterval(function() {
        if (!isInCall || !callConvId) { clearInterval(callPollInterval); callPollInterval = null; return; }
        var conv = conversations.find(function(c) { return c.id === callConvId; });
        if (!conv || !conv.messages) return;
        var lastMsg = conv.messages[conv.messages.length - 1];
        if (!lastMsg || lastMsg.role !== 'assistant') return;
        if (conv._lastSpokenIdx !== conv.messages.length) {
            conv._lastSpokenIdx = conv.messages.length;
            addCallSubtitle('ai', lastMsg.content);
            autoSpeakAiReply(conv, lastMsg.content);
        }
    }, 800);
}
